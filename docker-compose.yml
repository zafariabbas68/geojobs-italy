services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: geojobs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geojobs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geojobs-network

  redis:
    image: redis:7-alpine
    container_name: geojobs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geojobs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geojobs-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@geojobs-postgres:5432/geojobs
      REDIS_URL: redis://geojobs-redis:6379/0
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - geojobs-network

volumes:
  postgres_data:
  redis_data:

networks:
  geojobs-network:
    driver: bridge
